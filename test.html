<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
</head>
<body>
  <div id="output"></div>
  <div id="staff" style="border: 1px solid red; width: 500px; height: 200px;"></div>
  <script>
    const out = document.getElementById('output');
    out.innerHTML += '<p>typeof VexFlow: ' + typeof VexFlow + '</p>';
    out.innerHTML += '<p>typeof Vex: ' + typeof Vex + '</p>';

    try {
      const keys = Object.keys(VexFlow).filter(k => /^[A-Z]/.test(k)).sort().join(', ');
      out.innerHTML += '<p>VexFlow keys: ' + keys + '</p>';
    } catch(e) {
      out.innerHTML += '<p>Error getting keys: ' + e.message + '</p>';
    }

    try {
      const { Renderer, Stave, StaveNote, Voice, Formatter, StaveConnector } = VexFlow;
      out.innerHTML += '<p>Renderer: ' + typeof Renderer + '</p>';
      out.innerHTML += '<p>Stave: ' + typeof Stave + '</p>';
      out.innerHTML += '<p>Voice: ' + typeof Voice + '</p>';
      out.innerHTML += '<p>StaveConnector: ' + typeof StaveConnector + '</p>';

      const div = document.getElementById('staff');
      const renderer = new Renderer(div, Renderer.Backends.SVG);
      renderer.resize(400, 160);
      const context = renderer.getContext();
      const stave = new Stave(40, 20, 300);
      stave.addClef('treble');
      stave.setContext(context).draw();

      const note = new StaveNote({ keys: ['c/4'], duration: 'w', clef: 'treble' });
      const voice = new Voice({ num_beats: 4, beat_value: 4 });
      voice.setMode(Voice.Mode.SOFT);
      voice.addTickables([note]);
      new Formatter().joinVoices([voice]).format([voice], 220);
      voice.draw(context, stave);

      out.innerHTML += '<p style="color:green">SUCCESS - rendered!</p>';
    } catch(e) {
      out.innerHTML += '<p style="color:red">Error: ' + e.message + '</p>';
      out.innerHTML += '<pre>' + e.stack + '</pre>';
    }
  </script>
</body>
</html>
